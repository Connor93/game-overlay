appId: com.gameoverlay.app
productName: Game Overlay
files:
  - src/**
  - package.json
  - "!node_modules/@tesseract.js-data/eng/4.0.0/**" # only the 4.0.0_best_int model is used
# The OCR worker, its wasm core and the English model must be real files on disk, not inside app.asar.
asarUnpack:
  - node_modules/tesseract.js/**
  - node_modules/tesseract.js-core/**
  - node_modules/@tesseract.js-data/eng/4.0.0_best_int/**
directories:
  buildResources: build
  output: dist
mac:
  target:
    - target: dmg
      arch: universal
    - target: zip
      arch: universal
  identity: "-" # ad-hoc signature: no paid certificate, but downloads aren't reported as "damaged"
  category: public.app-category.utilities
  extendInfo:
    LSUIElement: true # no Dock icon
win:
  target:
    - nsis
    - portable
nsis:
  oneClick: true
publish:
  provider: github
  releaseType: draft # uploads into the draft the workflow creates; a later job publishes it
