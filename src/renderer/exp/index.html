<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'">
  <link rel="stylesheet" href="../panel-shell/shell.css">
  <link rel="stylesheet" href="exp.css">
</head>
<body>
  <div id="border"></div>
  <header id="toolbar">
    <button class="tab" data-tab="live">Live</button>
    <button class="tab" data-tab="history">History</button>
    <span id="tag">ACTIVE</span>
  </header>

  <main id="content">
    <section id="live">
      <div class="map" id="map">—</div>
      <div class="sub" id="sub"></div>
      <div class="big"><span id="rate">—</span> <small>EXP / hour</small></div>
      <div class="grid">
        <div><label>Session</label><span id="duration">—</span></div>
        <div><label>Gained</label><span id="gained">—</span></div>
        <div><label>To level</label><span id="toLevel">—</span></div>
        <div><label>Last 5 min</label><span id="recent">—</span></div>
      </div>
      <div class="status"><span id="status"></span></div>
      <div class="hint-line" id="hint" hidden></div>
      <button id="permission" class="small" hidden>Open Screen Recording settings</button>
      <form id="nameForm" hidden>
        <input id="mapName" placeholder="Name this map" autocomplete="off">
        <button class="small">Save</button>
      </form>
      <button id="startStop" class="primary">Start</button>
    </section>

    <section id="history" hidden>
      <div id="mapList"></div>
      <div id="sessionList" hidden>
        <button id="back" class="small">‹ All maps</button>
        <div class="sub" id="openMapTitle"></div>
        <div id="sessions"></div>
      </div>
    </section>
  </main>

  <footer id="statusbar"><span class="hint">Drag the bar above to move · drag edges to resize</span></footer>
  <div class="resize" data-edge="right"></div>
  <div class="resize" data-edge="bottom"></div>
  <div class="resize" data-edge="corner"></div>
  <script src="../panel-shell/shell.js"></script>
  <script src="exp.js"></script>
</body>
</html>
